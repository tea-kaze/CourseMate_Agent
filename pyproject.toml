[project]
name = "coursemate"
version = "0.1.0"
description = "Course-material RAG assistant with scoped chat, quiz generation, grading, and mistake review"
readme = "README.md"
authors = [
    { name = "tea-kaze", email = "1941610015@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-milvus>=0.4.0",
    "langchain-openai>=1.4.3",
    "langchain-siliconflow>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-prebuilt>=1.1.0",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.1",
    "pypdf>=6.15.0",
    "python-docx>=1.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
    "alembic>=1.19.1",
]

[project.scripts]
coursemate = "coursemate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires explicitly authorized external services",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# 包代码位于项目根目录（平铺布局）；uv_build 默认按 src 布局查找模块
[tool.uv.build-backend]
module-root = ""
